<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StayChat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .chat-header {
            padding: 20px;
            background: #1f2937;
            color: white;
        }

        .chat-header h1 {
            font-size: 22px;
        }

        .chat-header p {
            margin-top: 5px;
            font-size: 14px;
            color: #d1d5db;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background: #2563eb;
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background: #e5e7eb;
            color: #111827;
        }

        .typing-message {
            align-self: flex-start;
            background: #e5e7eb;
            color: #6b7280;
            font-style: italic;
        }

        .input-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        #sendButton {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h1>🏨 StayChat</h1>
            <p>AI Hotel Booking Assistant</p>
        </div>

        <div
            id="messages"
            class="messages"
        >
            <div class="message bot-message">
                Hello! Welcome to StayChat. 👋

                Tell me your check-in date, number of guests,
                and room preference, and I'll find the best
                room options for you.
            </div>
        </div>

        <div class="input-container">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script>
        const messagesContainer = document.getElementById(
            "messages"
        );

        const messageInput = document.getElementById(
            "messageInput"
        );

        const sendButton = document.getElementById(
            "sendButton"
        );


        /*
         * Create one session ID for this browser session.
         * This allows the backend to maintain conversation state.
         */
        let sessionId = localStorage.getItem(
            "staychat_session_id"
        );


        if (!sessionId) {
            sessionId = crypto.randomUUID();

            localStorage.setItem(
                "staychat_session_id",
                sessionId
            );
        }


        function addMessage(
            text,
            type
        ) {
            const messageElement =
                document.createElement("div");

            messageElement.classList.add(
                "message"
            );

            messageElement.classList.add(
                type === "user"
                    ? "user-message"
                    : "bot-message"
            );

            messageElement.textContent = text;

            messagesContainer.appendChild(
                messageElement
            );

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;
        }


        function showTyping() {
            const typingElement =
                document.createElement("div");

            typingElement.id = "typing";

            typingElement.classList.add(
                "message",
                "typing-message"
            );

            typingElement.textContent =
                "StayChat is thinking...";

            messagesContainer.appendChild(
                typingElement
            );

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;
        }


        function removeTyping() {
            const typingElement =
                document.getElementById("typing");

            if (typingElement) {
                typingElement.remove();
            }
        }


        async function sendMessage() {

            const message = messageInput.value.trim();

            if (!message) {
                return;
            }


            addMessage(
                message,
                "user"
            );


            messageInput.value = "";

            messageInput.disabled = true;

            sendButton.disabled = true;

            showTyping();


            try {

                const response = await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            {
                                session_id: sessionId,
                                message: message
                            }
                        )
                    }
                );


                const data = await response.json();

                removeTyping();


                if (!response.ok) {

                    addMessage(
                        data.error ||
                        "Something went wrong. Please try again.",
                        "bot"
                    );

                    return;
                }


                addMessage(
                    data.reply,
                    "bot"
                );

            } catch (error) {

                removeTyping();

                addMessage(
                    "Unable to connect to the server. Please try again.",
                    "bot"
                );

                console.error(error);

            } finally {

                messageInput.disabled = false;

                sendButton.disabled = false;

                messageInput.focus();
            }
        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keypress",
            function (event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );
    </script>

</body>
</html>
